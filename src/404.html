<!doctype html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — SOKLARP.ORG</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="Page not found. Return to SOKLARP.ORG virtual-credits entertainment platform." />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .page-404 {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: #09090f;
    }
    .page-404-card {
      width: min(680px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(18, 18, 26, 0.88);
      padding: 2rem;
      text-align: center;
    }
    .page-404-code {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      margin: 0;
      color: #c9a227;
      letter-spacing: 0.06em;
    }
    .page-404-title {
      margin: 0.75rem 0;
      color: #fff;
      font-size: clamp(1.25rem, 3.5vw, 2rem);
    }
    .page-404-desc {
      margin: 0 auto 1.5rem;
      max-width: 52ch;
      color: rgba(255, 255, 255, 0.85);
    }
    .page-404-btn {
      display: inline-block;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      color: #111;
      background: #c9a227;
    }
  </style>
</head>
<body>
  <main class="page-404">
    <section class="page-404-card" aria-labelledby="title-404">
      <p class="page-404-code" aria-hidden="true">404</p>
      <h1 id="title-404" class="page-404-title">Page not found</h1>
      <p class="page-404-desc">
        This URL does not exist on SOKLARP.ORG. Virtual credits only — entertainment platform.
      </p>
      <a class="page-404-btn" href="/">Back to home</a>
    </section>

</body>
</html>
