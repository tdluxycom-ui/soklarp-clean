name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      # Pure odds math, no server needed — fails the build if any bet pays more than it takes.
      - run: npm run test:odds
      - run: npm run build
      - name: Start server
        run: |
          PORT=59617 INITIAL_ADMIN_PASSWORD=admin123 INITIAL_PLAYER_PASSWORD=player123 node server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:59617/api/health && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:smoke
        env:
          BASE: http://127.0.0.1:59617
      - run: npm run test:exploits
        env:
          BASE: http://127.0.0.1:59617
